[project]
name = "alicartuning-mp-bot"
version = "0.1.0"
description = "Telegram AI-менеджер маркетплейсов (Wildberries/Ozon) для ALICARTUNING"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "anthropic>=0.39",
    "celery>=5.4",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
