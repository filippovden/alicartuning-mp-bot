services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alicartuning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alicartuning}
      POSTGRES_DB: ${POSTGRES_DB:-alicartuning}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу (на хост) намеренно НЕ публикуется — postgres нужен только
    # другим контейнерам этого docker-compose (они видят его по имени сервиса
    # через внутреннюю сеть compose). Если нужен доступ с ноутбука (pgAdmin и
    # т.п.), поднимите SSH-туннель до сервера, а не открывайте порт в интернет:
    # `ssh -L 5432:localhost:5432 user@server`, а на сервере верните маппинг
    # `ports: ["127.0.0.1:5432:5432"]`, чтобы порт слушал только локально.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alicartuning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Порт тоже не публикуется наружу — та же логика, что и для postgres.

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Порт наружу не публикуется по умолчанию: бот общается с БД напрямую и
    # backend ему для этого не нужен, а лишний открытый порт — лишняя
    # поверхность атаки. Если вам реально нужен доступ к /newProduct,
    # /publish/{id} и т.д. извне (например, для внешней интеграции), раскомментируйте
    # ниже — но ОБЯЗАТЕЛЬНО убедитесь, что API_AUTH_TOKEN в .env задан
    # (см. app/api/deps.py) и что это случайная строка, а не пусто.
    # ports:
    #   - "8000:8000"
    volumes:
      - ./storage:/app/storage
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./storage:/app/storage
    command: python -m app.bot.main

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./storage:/app/storage
    command: celery -A app.worker.celery_app worker --loglevel=INFO

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: celery -A app.worker.celery_app beat --loglevel=INFO

volumes:
  pgdata:
