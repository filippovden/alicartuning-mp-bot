services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alicartuning
      POSTGRES_PASSWORD: alicartuning
      POSTGRES_DB: alicartuning
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alicartuning"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bot:
    build: .
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./storage:/app/storage
    command: python -m app.bot.main

  worker:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./storage:/app/storage
    command: celery -A app.worker.celery_app worker --loglevel=INFO

volumes:
  pgdata:
